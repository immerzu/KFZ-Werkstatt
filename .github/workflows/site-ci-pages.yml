name: Website - Browsertests und Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright installieren (festgelegte Version)
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Desktop und Mobile testen
        run: npx playwright test --config=playwright.config.cjs
      - name: Screenshots, Traces und HTML-Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browserbericht
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  pages:
    needs: browser-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Nur die eigentlichen Webdateien bereitstellen
        run: |
          mkdir -p webausgabe
          cp -v ./*.html ./*.css ./*.js ./*.json robots.txt sitemap.xml webausgabe/
          cp -R bilder leistungen wartung webausgabe/
          touch webausgabe/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: webausgabe
      - name: Nur nach erfolgreichen Tests veroeffentlichen
        id: veroeffentlichen
        uses: actions/deploy-pages@v4
